# kube-prometheus-stack on EKS. Same choices as local/monitoring/, minus:
#   - ingresses (no load balancer to clean up; reach UIs with kubectl port-forward)
#   - the Grafana Postgres data source host, which comes from infra outputs
#     (added in monitoring.tf); its password comes from Secrets Manager via
#     External Secrets, never from this file

# Managed control plane: these components' metrics aren't scrapeable on EKS.
kubeEtcd: {enabled: false}
kubeControllerManager: {enabled: false}
kubeScheduler: {enabled: false}
kubeProxy: {enabled: false}
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

prometheus:
  prometheusSpec:
    # Pick up the pipeline chart's PodMonitor and PrometheusRule.
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    evaluationInterval: 15s
    # Metrics survive restarts and rescheduling on an EBS volume. The volume is
    # deleted together with Prometheus, so destroy leaves nothing behind.
    retention: 7d
    retentionSize: 8GB # stay inside the 10Gi volume
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Delete
      whenScaled: Retain
    resources:
      requests: {cpu: 200m, memory: 512Mi}
      limits: {memory: 1536Mi}

alertmanager:
  alertmanagerSpec:
    resources:
      requests: {cpu: 10m, memory: 64Mi}

grafana:
  # 13.2 spun at ~1.7 cores on minikube and starved the pipeline; pinned to 12.x.
  image:
    tag: 12.3.1
  deploymentStrategy:
    type: Recreate # also required by the ReadWriteOnce volume below
  # Dashboards, users and settings survive restarts. The PVC is a normal Helm
  # resource, so uninstall (destroy) deletes it and its EBS volume.
  persistence:
    enabled: true
    type: pvc
    storageClassName: gp3
    accessModes: [ReadWriteOnce]
    size: 2Gi
  admin:
    existingSecret: grafana-admin-credentials # synced from Secrets Manager
    userKey: admin-user
    passwordKey: admin-password
  envValueFrom:
    TRADES_DB_PASSWORD:
      secretKeyRef:
        name: grafana-trades-db # synced from Secrets Manager
        key: password
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
    plugins:
      preinstall_disabled: true
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    news:
      news_feed_enabled: false
    dashboards:
      default_home_dashboard_path: /tmp/dashboards/trades-pipeline.json
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 768Mi}
