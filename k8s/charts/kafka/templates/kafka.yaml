# One broker, also its own KRaft controller. Lab sizing: a restart pauses
# ingestion briefly (producers buffer, consumers resume from committed offsets).
# Production: 3 brokers across AZs with RF 3 / min.insync.replicas 2, or MSK.
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: tls
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  # Deleting Kafka (helm uninstall / terraform destroy) deletes its volume too,
  # so nothing is left behind in the account.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
      annotations:
        # Restart the broker when its configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/kafka-config.yaml") . | sha256sum | trunc 16 }}
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000 # the image runs as appuser (1000); lets it write the EBS volume
      terminationGracePeriodSeconds: 60 # time for a clean shutdown and log flush
      containers:
        - name: kafka
          image: {{ .Values.image }}
          command: [bash, -ec]
          args:
            - |
              # PEM keystore = private key followed by its certificate chain.
              cat /etc/kafka/tls-src/tls.key /etc/kafka/tls-src/tls.crt > /etc/kafka/tls/keystore.pem
              /opt/kafka/bin/kafka-storage.sh format --ignore-formatted \
                -t {{ .Values.clusterId | quote }} -c /etc/kafka/config/server.properties
              exec /opt/kafka/bin/kafka-server-start.sh /etc/kafka/config/server.properties
          ports:
            - containerPort: 9092
          env:
            - name: KAFKA_HEAP_OPTS
              value: {{ .Values.heap | quote }}
          # exec, not tcpSocket: the NetworkPolicy admits only listed pods, and
          # a check from inside the pod doesn't depend on it.
          readinessProbe:
            exec:
              command: [bash, -c, "exec 3<>/dev/tcp/127.0.0.1/9092"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            - name: config
              mountPath: /etc/kafka/config
            - name: tls-src
              mountPath: /etc/kafka/tls-src
              readOnly: true
            - name: tls
              mountPath: /etc/kafka/tls
      volumes:
        - name: config
          configMap:
            name: kafka-config
        - name: tls-src
          secret:
            secretName: kafka-broker-tls
        - name: tls
          emptyDir:
            medium: Memory # the combined key file never touches disk
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storage.className }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
