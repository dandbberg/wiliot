# Who may open a connection to a broker at all. Everything else is dropped
# before TLS starts; mTLS and ACLs then decide what an admitted client can do.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes: [Ingress]
  ingress:
    # Brokers among themselves: replication (9092) and the controller quorum (9093).
    - ports:
        - port: 9092
        - port: 9093
      from:
        - podSelector:
            matchLabels:
              app: kafka
    # Clients: the pipeline's namespace, KEDA (reads consumer lag), Kafka UI and the ACL Job.
    - ports:
        - port: 9092
      from:
        {{- range .Values.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [kafka-ui, kafka-acls]
