# Broker configuration. Configured with an explicit server.properties instead of
# the image's KAFKA_* environment translation: that path insists on JKS
# keystores with password files; we use unencrypted PEM from cert-manager.
# __NODE_ID__ and __HOST__ are filled in per broker at startup.
{{- $ns := .Release.Namespace }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
data:
  server.properties: |
    process.roles=broker,controller
    node.id=__NODE_ID__
    controller.quorum.voters={{ range $i, $_ := until (int .Values.replicas) }}{{ if $i }},{{ end }}{{ $i }}@broker-{{ $i }}.kafka-brokers.{{ $ns }}.svc.cluster.local:9093{{ end }}

    # Clients and replication on 9092, controller quorum on 9093; both TLS with
    # client certificates. The NetworkPolicy keeps 9093 to the brokers.
    listeners=SSL://:9092,CONTROLLER://:9093
    advertised.listeners=SSL://__HOST__.kafka-brokers.{{ $ns }}.svc.cluster.local:9092
    listener.security.protocol.map=SSL:SSL,CONTROLLER:SSL
    controller.listener.names=CONTROLLER
    inter.broker.listener.name=SSL

    ssl.keystore.type=PEM
    ssl.keystore.location=/etc/kafka/tls/keystore.pem
    ssl.truststore.type=PEM
    ssl.truststore.location=/etc/kafka/tls-src/ca.crt
    ssl.client.auth=required

    # Principal = the certificate's CN ("CN=producer" -> User:producer).
    ssl.principal.mapping.rules=RULE:^CN=([a-zA-Z0-9._-]+)$/$1/,DEFAULT
    authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
    super.users=User:kafka-broker
    allow.everyone.if.no.acl.found=false

    # A subdirectory: a fresh ext4 volume has lost+found at its root, which
    # Kafka would take for a malformed partition directory.
    log.dirs=/var/lib/kafka/data/logs

    # Every partition on all 3 brokers; a write needs 2 of them.
    default.replication.factor=3
    min.insync.replicas=2
    offsets.topic.replication.factor=3
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2
    unclean.leader.election.enable=false
    # Drop a dead follower from the in-sync set after 10 s instead of 30 s, so
    # acks=all writes stop waiting on it sooner (2 in-sync copies still required).
    replica.lag.time.max.ms=10000
    auto.create.topics.enable=false
    group.initial.rebalance.delay.ms=0
