{{- if .Values.ui.enabled }}
# Read-only web UI: topics, partitions, messages, consumer-group lag. No
# Service outside the cluster; reach it with
#   kubectl -n {{ .Release.Namespace }} port-forward svc/kafka-ui 8080:8080
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
spec:
  selector:
    app: kafka-ui
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      # Same reason as the broker: don't inject KAFKA_* service-link variables,
      # which Spring would bind as configuration.
      enableServiceLinks: false
      containers:
        - name: kafka-ui
          image: {{ .Values.ui.image }}
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: {{ .Values.ui.clusterName | quote }}
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka.{{ .Release.Namespace }}.svc.cluster.local:9092
            # Viewing only: no topic deletes, no offset resets, no producing.
            - name: KAFKA_CLUSTERS_0_READONLY
              value: "true"
            - name: DYNAMIC_CONFIG_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
{{- end }}
