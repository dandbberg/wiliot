{{- if .Values.ui.enabled }}
# Read-only web UI: topics, partitions, messages, consumer-group lag. No
# Service outside the cluster; reach it with
#   kubectl -n {{ .Release.Namespace }} port-forward svc/kafka-ui 8080:8080
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
spec:
  selector:
    app: kafka-ui
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        app: kafka-ui
    spec:
      # Same reason as the broker: don't inject KAFKA_* service-link variables,
      # which Spring would bind as configuration.
      enableServiceLinks: false
      # Its client certificate as a PEM keystore (key + chain), built in memory.
      initContainers:
        - name: keystore
          image: {{ .Values.image }}
          command: [bash, -ec, "cat /tls-src/tls.key /tls-src/tls.crt > /tls/keystore.pem"]
          volumeMounts:
            - {name: tls-src, mountPath: /tls-src, readOnly: true}
            - {name: tls, mountPath: /tls}
      containers:
        - name: kafka-ui
          image: {{ .Values.ui.image }}
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: {{ .Values.ui.clusterName | quote }}
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: kafka.{{ .Release.Namespace }}.svc.cluster.local:9092
            # Viewing only: no topic deletes, no offset resets, no producing.
            - name: KAFKA_CLUSTERS_0_READONLY
              value: "true"
            - name: DYNAMIC_CONFIG_ENABLED
              value: "false"
            # mTLS as principal "kafka-ui", whose ACLs only allow reading.
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL
              value: SSL
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_TYPE
              value: PEM
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SSL_KEYSTORE_LOCATION
              value: /tls/keystore.pem
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_TYPE
              value: PEM
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SSL_TRUSTSTORE_LOCATION
              value: /tls-src/ca.crt
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
          volumeMounts:
            - {name: tls-src, mountPath: /tls-src, readOnly: true}
            - {name: tls, mountPath: /tls}
      volumes:
        - name: tls-src
          secret:
            secretName: kafka-client-kafka-ui
        - name: tls
          emptyDir:
            medium: Memory
{{- end }}
