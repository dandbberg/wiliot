image: apache/kafka:4.1.0

# KRaft needs a fixed cluster id: 22 chars of URL-safe base64.
clusterId: dan-berg-eks-kafka-001

storage:
  className: gp3
  size: 20Gi

heap: -Xms1g -Xmx1g

resources:
  requests: {cpu: 250m, memory: 1536Mi}
  limits: {memory: 2Gi}

ui:
  enabled: true
  image: ghcr.io/kafbat/kafka-ui:v1.2.0
  clusterName: eks
  # CPU-capped: a UI must never be able to starve the broker or the pipeline.
  resources:
    requests: {cpu: 100m, memory: 384Mi}
    limits: {cpu: 500m, memory: 768Mi}
