# Run before the workloads on every install/upgrade. Both are idempotent.
{{- $jobs := list
  (dict "name" "topic-init" "module" "trades.topic" "sa" .Values.serviceAccounts.topicAdmin "weight" "-10")
  (dict "name" "db-init" "module" "trades.dbinit" "sa" .Values.serviceAccounts.dbAdmin "weight" "-5") }}
{{- range $jobs }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .name }}
  labels:
    {{- include "pipeline.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ .name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: {{ .weight | quote }}
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ .sa }}
      {{- include "pipeline.podSecurity" $ | nindent 6 }}
      containers:
        - name: {{ .name }}
          image: {{ include "pipeline.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args: [{{ .module }}]
          env:
            {{- include "pipeline.regionEnv" $ | nindent 12 }}
            {{- if eq .module "trades.topic" }}
            {{- include "pipeline.kafkaEnv" $ | nindent 12 }}
            - name: TOPIC_PARTITIONS
              value: {{ $.Values.kafka.partitions | quote }}
            - name: TOPIC_REPLICATION
              value: {{ $.Values.kafka.replication | quote }}
            - name: TOPIC_MIN_ISR
              value: {{ $.Values.kafka.minInsyncReplicas | quote }}
            - name: TOPIC_RETENTION_HOURS
              value: {{ $.Values.kafka.retentionHours | quote }}
            {{- else }}
            {{- include "pipeline.dbEnv" $ | nindent 12 }}
            {{- if eq $.Values.db.auth "iam" }}
            - name: DB_ADMIN_SECRET_ARN
              value: {{ required "db.adminSecretArn is required for auth=iam" $.Values.db.adminSecretArn | quote }}
            {{- with $.Values.db.readerSecretArn }}
            - name: DB_READER_SECRET_ARN
              value: {{ . | quote }}
            {{- end }}
            {{- else }}
            - name: DB_ADMIN_USER
              value: {{ $.Values.db.adminUser | quote }}
            - name: DB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.db.passwordSecret }}
                  key: admin-password
            {{- end }}
            {{- end }}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          {{- include "pipeline.containerSecurity" $ | nindent 10 }}
{{- end }}
