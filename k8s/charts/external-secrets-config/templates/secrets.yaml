# The store has no auth block: the controller uses its own IRSA role, which may
# only read the two grafana secrets.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region }}
---
# Grafana admin login: keys admin-user / admin-password, as the chart expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin-credentials
  dataFrom:
    - extract:
        key: {{ required "grafanaAdminSecret" .Values.grafanaAdminSecret }}
---
# Read-only DB user for Grafana's Postgres data source and postgres_exporter.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-trades-db
  namespace: {{ .Values.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-trades-db
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "grafanaDbSecret" .Values.grafanaDbSecret }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.grafanaDbSecret }}
        property: password
