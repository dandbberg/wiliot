image: nginxinc/nginx-unprivileged:1.27.5-alpine
replicas: 2

# Who may reach the load balancer at all (required, never empty).
allowedCidrs: []

# Secrets Manager secret with {username, password}: the login for Kafka UI,
# Prometheus and Alertmanager. Grafana and Argo CD have their own.
adminSecret: ""

# Public port -> in-cluster service. "login: true" puts the gateway's login in front.
uis:
  - name: grafana
    port: 3000
    upstream: monitoring-grafana.monitoring.svc.cluster.local:80
    login: false
  - name: kafka-ui
    port: 8080
    upstream: kafka-ui.kafka.svc.cluster.local:8080
    login: true
  - name: prometheus
    port: 9090
    upstream: monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
    login: true
  - name: alertmanager
    port: 9093
    upstream: monitoring-kube-prometheus-alertmanager.monitoring.svc.cluster.local:9093
    login: true
  - name: argocd # its own login (admin)
    port: 8443
    upstream: argocd-server.argocd.svc.cluster.local:80
    login: false
