apiVersion: v1
kind: ConfigMap
metadata:
  name: ui-gateway
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    http {
      client_body_temp_path /tmp/client_body;
      proxy_temp_path       /tmp/proxy;
      fastcgi_temp_path     /tmp/fastcgi;
      uwsgi_temp_path       /tmp/uwsgi;
      scgi_temp_path        /tmp/scgi;
      access_log /dev/stdout;
      server_tokens off;

      ssl_certificate     /tls/tls.crt;
      ssl_certificate_key /tls/tls.key;
      ssl_protocols       TLSv1.2 TLSv1.3;

      # Grafana Live and Kafka UI use WebSockets.
      map $http_upgrade $connection_upgrade { default upgrade; "" close; }

      {{- range .Values.uis }}

      server { # {{ .name }}
        listen {{ .port }} ssl;
        error_page 497 =301 https://$host:$server_port$request_uri; # http:// on this port
        {{- if .login }}
        auth_basic "{{ .name }}";
        auth_basic_user_file /login/htpasswd;
        {{- end }}
        location / {
          proxy_pass http://{{ .upstream }};
          proxy_http_version 1.1;
          proxy_set_header Host $http_host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          {{- if .login }}
          proxy_set_header Authorization ""; # the login is the gateway's, not the app's
          {{- end }}
        }
      }
      {{- end }}
    }
