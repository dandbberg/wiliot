# The login, synced from Secrets Manager into nginx's password file. It never
# exists outside AWS and this cluster.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ui-gateway-login
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: ui-gateway-login
    template:
      data:
        # nginx reads {PLAIN}; the Secret (KMS-encrypted) is what protects it.
        htpasswd: {{ `"{{ .username }}:{PLAIN}{{ .password }}"` }}
  dataFrom:
    - extract:
        key: {{ required "adminSecret" .Values.adminSecret }}
---
# TLS from the cluster's own CA (kafka-pki). Not publicly trusted, so the
# browser warns once; the traffic is still encrypted, the login included.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ui-gateway
spec:
  secretName: ui-gateway-tls
  commonName: ui-gateway
  dnsNames: ["ui-gateway"]
  duration: 2160h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: kafka-ca
