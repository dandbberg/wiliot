# A self-signed issuer exists only to sign the CA; the CA then issues every
# broker and client certificate. All private keys are generated by cert-manager
# inside the cluster (Kubernetes Secrets, KMS-encrypted): none in Git or state.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kafka-ca
  namespace: {{ .Release.Namespace }} # must be cert-manager's namespace for a ClusterIssuer CA
spec:
  isCA: true
  commonName: kafka-ca
  secretName: kafka-ca
  duration: 8760h # 1 year
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: kafka-ca
spec:
  ca:
    secretName: kafka-ca
